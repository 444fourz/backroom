services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubcore
      POSTGRES_PASSWORD: clubcore
      POSTGRES_DB: clubcore
    ports:
      - "5432:5432"
    volumes:
      - clubcore_postgres_data:/var/lib/postgresql/data

volumes:
  clubcore_postgres_data:
