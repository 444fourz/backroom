services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: backroom
      POSTGRES_PASSWORD: backroom
      POSTGRES_DB: backroom
    ports:
      - "5432:5432"
    volumes:
      - backroom_postgres_data:/var/lib/postgresql/data

volumes:
  backroom_postgres_data:
